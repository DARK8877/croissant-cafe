<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Круасан и точка</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <svg class="login__logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#496B55"/>
      <path d="M12 38c2-12 10-18 20-18s18 6 20 18c-4-3-8-4-12-4-3 0-5 2-8 2s-5-2-8-2c-4 0-8 1-12 4z" fill="#F7F1E5"/>
      <circle cx="48" cy="46" r="6" fill="#DE7848"/>
    </svg>
    <h1>Круасан и точка</h1>
    <p class="login__sub">Вход в панель администратора</p>

    <form id="loginForm" novalidate>
      <label>Логин<input type="text" id="login" autocomplete="username" required></label>
      <label>Пароль<input type="password" id="password" autocomplete="current-password" required></label>
      <p class="error" id="loginError" role="alert"></p>
      <button type="submit" class="btn">Войти</button>
    </form>

    <p class="hint">
      Вход проверяет сервер заказов. Логин по умолчанию — <code>admin</code>, пароль задаёт владелец сайта (см. README).
    </p>
    <a href="index.html" class="back">← Вернуться на сайт</a>
  </main>
  <script src="config.js"></script>
<script src="storage.js"></script>
  <script src="login.js"></script>
</body>
</html>
